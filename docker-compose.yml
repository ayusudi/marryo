# Local Postgres matching Cloud SQL (Prisma provider = postgresql).
services:
  postgres:
    image: postgres:16-alpine
    container_name: marryo-postgres
    environment:
      POSTGRES_USER: marryo
      POSTGRES_PASSWORD: marryo
      POSTGRES_DB: marryo
    ports:
      - "5432:5432"
    volumes:
      - marryo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marryo -d marryo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  marryo_pg:
