[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "marryo-agent"
version = "0.0.0"
description = "Marryo Film Director - Google ADK agent and its video tools"
requires-python = ">=3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
packages = ["marryo_agent", "tools", "cv"]
